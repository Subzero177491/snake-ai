```html
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#ffffff">
  <title>Snake AI</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #ffffff;
      color: #202123;
      height: 100vh;
      display: flex;
    }

    .sidebar {
      width: 250px;
      background: #f7f7f8;
      border-right: 1px solid #e5e5e5;
      padding: 20px;
      display: flex;
      flex-direction: column;
    }

    .brand {
      font-size: 23px;
      font-weight: bold;
      margin-bottom: 28px;
    }

    .brand span {
      color: #16a34a;
    }

    .new-chat {
      border: 1px solid #d9d9e3;
      background: white;
      padding: 12px;
      border-radius: 10px;
      text-align: left;
      cursor: pointer;
      font-size: 14px;
    }

    .new-chat:hover {
      background: #eeeeef;
    }

    .sidebar-note {
      margin-top: auto;
      font-size: 12px;
      color: #777;
      line-height: 1.5;
    }

    .main {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    header {
      width: 100%;
      padding: 17px 24px;
      border-bottom: 1px solid #eeeeee;
      font-size: 16px;
      font-weight: bold;
    }

    #chat {
      width: 100%;
      max-width: 800px;
      flex: 1;
      overflow-y: auto;
      padding: 25px 22px;
    }

    .welcome {
      text-align: center;
      margin-top: 14vh;
    }

    .logo {
      font-size: 52px;
    }

    .welcome h1 {
      font-size: 30px;
      margin: 12px 0;
    }

    .welcome p {
      color: #777;
      line-height: 1.6;
    }

    .message {
      margin: 20px 0;
      line-height: 1.7;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .message .label {
      display: block;
      font-size: 13px;
      font-weight: bold;
      margin-bottom: 6px;
      color: #16803d;
    }

    .message.user .label {
      color: #555;
    }

    .composer-wrap {
      width: 100%;
      max-width: 800px;
      padding: 12px 20px 18px;
    }

    .composer {
      display: flex;
      align-items: flex-end;
      gap: 10px;
      border: 1px solid #d9d9e3;
      border-radius: 17px;
      padding: 10px;
      box-shadow: 0 2px 8px #0000000a;
    }

    textarea {
      flex: 1;
      resize: none;
      border: none;
      outline: none;
      font: inherit;
      padding: 9px;
      min-height: 42px;
      max-height: 150px;
      background: transparent;
    }

    #send {
      border: none;
      background: #16a34a;
      color: white;
      border-radius: 10px;
      width: 42px;
      height: 42px;
      font-size: 20px;
      cursor: pointer;
    }

    #send:hover {
      background: #15803d;
    }

    #send:disabled {
      opacity: 0.5;
      cursor: wait;
    }

    .disclaimer {
      text-align: center;
      font-size: 11px;
      color: #888;
      margin-top: 10px;
    }

    @media (max-width: 600px) {
      .sidebar {
        display: none;
      }

      header {
        padding: 16px;

      #chat {
        padding: 18px;
      }

      .welcome {
        margin-top: 12vh;
      }

      .welcome h1 {
        font-size: 25px;
      }

      .composer-wrap {
        padding: 10px 12px 15px;
      }
    }
  </style>
</head>
<body>
  <aside class="sidebar">
    <div class="brand">🐍 Snake <span>AI</span></div>
    <button class="new-chat" id="newChat">＋ New chat</button>
    <div class="sidebar-note">
      Snake AI<br>
      Your personal AI project.<br><br>
      AI connection: Not configured
    </div>
  </aside>

  <main class="main">
    <header>🐍 Snake AI</header>

    <section id="chat" aria-live="polite">
      <div class="welcome" id="welcome">
        <div class="logo">🐍</div>
        <h1>What can I help you with?</h1>
        <p>Ask questions, explore ideas, or write some code.<br>
        Your AI journey starts here.</p>
      </div>
    </section>

    <div class="composer-wrap">
      <form class="composer" id="chatForm">
        <textarea id="prompt" placeholder="Message Snake AI..." rows="1"
          aria-label="Message Snake AI"></textarea>
        <button id="send" type="submit" aria-label="Send message">↑</button>
      </form>
      <div class="disclaimer">
        Snake AI preview · Connect an AI backend to enable intelligent answers.
      </div>
    </div>
  </main>

  <script>
    const chat = document.getElementById("chat");
    const form = document.getElementById("chatForm");
    const promptBox = document.getElementById("prompt");
    const sendButton = document.getElementById("send");
    const welcome = document.getElementById("welcome");

    function addMessage(role, text) {
      const message = document.createElement("div");
      message.className = "message " + role;

      const label = document.createElement("span");
      label.className = "label";
      label.textContent = role === "user" ? "You" : "Snake AI";

      const content = document.createElement("div");
      content.textContent = text;

      message.append(label, content);
      chat.appendChild(message);
      chat.scrollTop = chat.scrollHeight;
    }

    form.addEventListener("submit", function(event) {
      event.preventDefault();
      const text = promptBox.value.trim();

      if (!text) return;

      if (welcome) welcome.remove();

      addMessage("user", text);
      addMessage(
        "assistant",
        "I'm currently a website preview! My AI brain hasn't been connected yet. Once we configure a secure AI backend, I'll be able to answer questions and help with coding."
      );

      promptBox.value = "";
      promptBox.style.height = "auto";
      promptBox.focus();
    });

    promptBox.addEventListener("input", function() {
      this.style.height = "auto";
      this.style.height = Math.min(this.scrollHeight, 150) + "px";
    });

    promptBox.addEventListener("keydown", function(event) {
      if (event.key === "Enter" && !event.shiftKey) {
        event.preventDefault();
        form.requestSubmit();
      }
    });

    document.getElementById("newChat").addEventListener("click", function() {
      chat.innerHTML = "";
      const newWelcome = document.createElement("div");
      newWelcome.className = "welcome";
      newWelcome.innerHTML =
        '<div class="logo">🐍</div>' +
        '<h1>What can I help you with?</h1>' +
        '<p>Ask questions, explore ideas, or write some code.<br>' +
        'Your AI journey starts here.</p>';
      chat.appendChild(newWelcome);
      promptBox.value = "";
      promptBox.focus();
    });
  </script>
</body>
</html>
